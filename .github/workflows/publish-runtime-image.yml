name: Publish Runtime Base Image

on:
  workflow_dispatch:
  # Build on pull requests too, without publishing, so a change to this workflow or
  # to what the image contains is proven before it reaches main. Scoped by path
  # because the build is slow and most changes here cannot affect the image.
  pull_request:
    paths:
      - apps/container-bridge/**
      - packages/shared/**
      - .github/workflows/publish-runtime-image.yml
      - pnpm-lock.yaml
      - .nvmrc
  push:
    branches:
      - main
    tags:
      - "runtime-v*"

# No id-token: the shared action reaches ECR through the runner pod's IRSA
# identity, not GitHub OIDC. No packages: write either, now that nothing here
# publishes to GHCR.
permissions:
  contents: read

jobs:
  publish:
    # Same-repository pull requests only. A fork's head is untrusted code, and this
    # pod's IRSA identity can assume the ECR read-write and EKS deploy roles -- a
    # pod credential, so GitHub withholding secrets from a fork withholds nothing
    # that matters here. The validation build cannot move to an ephemeral runner
    # instead: buildah is only in the builder images, and `FROM node:22-slim` is
    # rewritten to the ECR pull-through cache, which needs those same credentials.
    #
    # Guarded on the job because a trigger has no fork filter. The event_name clause
    # keeps push and workflow_dispatch running, where there is no pull_request
    # payload to compare against.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # linux/arm64 only, built natively. trace-deployment is the only consumer and
    # builds arm64, and these pods carry no qemu for a cross-architecture build.
    runs-on: arm-builder-lg
    steps:
      - uses: opendoor-labs/gha/checkout-with-retry@checkout-with-retry-1.1.0-action

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # packages/shared depends on node-pty, which has no prebuilt binary for
      # linux/arm64 and so compiles through node-gyp. This image ships python3 but
      # no make or compiler; ubuntu-latest carries both, which is why the
      # dependency only shows up now that the build runs here.
      - name: Install node-gyp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 make g++

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @trace/shared build

      - name: Build container bridge
        run: pnpm --filter @trace/container-bridge build

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The Dockerfile COPYs packages/shared/dist and apps/container-bridge/dist,
      # so the pnpm builds above are prerequisites rather than conveniences. That
      # is why this calls the composite action from inside a job instead of the
      # build-push reusable workflow, which owns the whole job and would leave
      # nowhere to produce them.
      - name: Build and push
        uses: opendoor-labs/gha/build-push@build-push-1.5.0-action
        with:
          image_name: trace-container-bridge
          image_tag: sha-${{ steps.sha.outputs.short }}
          platform: linux/arm64
          add_platform_suffix: false
          dockerfile: apps/container-bridge/Dockerfile
          context: .
          # Pull requests validate the build and stop there. Nothing is pushed when
          # this is false, including the tags below, so they need no gate of their
          # own for that case.
          push: ${{ github.event_name != 'pull_request' }}
          # latest is what trace-deployment resolves when no ref is pinned, so it
          # moves on main and nowhere else.
          push_latest: ${{ github.ref == 'refs/heads/main' }}
          # runtime-v* is a deliberate release marker, so it survives the move off
          # docker/metadata-action. That action's branch-ref tags do not: nothing
          # consumes them. On any other ref this expression yields an empty line,
          # which the action skips -- which is what lets the tag be gated here
          # rather than in a step of its own.
          additional_tags: |
            ${{ startsWith(github.ref, 'refs/tags/runtime-v') && github.ref_name || '' }}
          # Off deliberately: buildah exports cache into the image repository
          # itself, and this image is published rarely enough that cache tags
          # accumulating alongside it costs more than the rebuild saves.
          cache-mode: disabled
