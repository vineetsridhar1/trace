name: Publish Runtime Base Image

on:
  workflow_dispatch:
  # Build on pull requests too, without publishing, so a change to this workflow or
  # to what the image contains is proven before it reaches main. Scoped by path
  # because the build is slow and most changes here cannot affect the image.
  pull_request:
    paths:
      - apps/container-bridge/**
      - packages/shared/**
      - .github/workflows/publish-runtime-image.yml
      - pnpm-lock.yaml
      - .nvmrc
  push:
    branches:
      - main
    tags:
      - "runtime-v*"

# No id-token: the shared action reaches ECR through the runner pod's IRSA
# identity, not GitHub OIDC. No packages: write either, now that nothing here
# publishes to GHCR.
permissions:
  contents: read

jobs:
  publish:
    # linux/arm64 only, built natively. trace-deployment is the only consumer and
    # builds arm64, and these pods carry no qemu for a cross-architecture build.
    runs-on: arm-builder-lg
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @trace/shared build

      - name: Build container bridge
        run: pnpm --filter @trace/container-bridge build

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The Dockerfile COPYs packages/shared/dist and apps/container-bridge/dist,
      # so the pnpm builds above are prerequisites rather than conveniences. That
      # is why this calls the composite action from inside a job instead of the
      # build-push reusable workflow, which owns the whole job and would leave
      # nowhere to produce them.
      - name: Build and push
        id: build
        uses: opendoor-labs/gha/build-push@build-push-1.4.0-action
        with:
          image_name: trace-container-bridge
          image_tag: sha-${{ steps.sha.outputs.short }}
          platform: linux/arm64
          add_platform_suffix: false
          dockerfile: apps/container-bridge/Dockerfile
          context: .
          # Pull requests validate the build and stop there. The moving-tag steps
          # below are already ref-gated, so they skip on their own.
          push: ${{ github.event_name != 'pull_request' }}
          # Off deliberately: buildah exports cache into the image repository
          # itself, and this image is published rarely enough that cache tags
          # accumulating alongside it costs more than the rebuild saves.
          cache-mode: disabled

      # The action publishes one tag, so the moving tags are pushed from local
      # storage. gzip matches the action's own compression, so these upload a
      # manifest rather than the layers again.
      - name: Push latest
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          latest="${IMAGE%:*}:latest"
          sudo buildah tag "$IMAGE" "$latest"
          sudo buildah push --compression-format gzip "$latest"

      # runtime-v* tags are a deliberate release marker, so they survive the move
      # off docker/metadata-action. Its branch-ref tags do not: nothing consumes
      # them.
      - name: Push release tag
        if: startsWith(github.ref, 'refs/tags/runtime-v')
        env:
          IMAGE: ${{ steps.build.outputs.image_tag }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release="${IMAGE%:*}:${RELEASE_TAG}"
          sudo buildah tag "$IMAGE" "$release"
          sudo buildah push --compression-format gzip "$release"
