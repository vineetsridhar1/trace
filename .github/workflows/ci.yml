name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    # Lint and typecheck only -- no Docker here, so a general runner rather than a builder.
    runs-on: runner-md-ng
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # node-pty publishes no prebuild for linux-x64, so pnpm install compiles it through
      # node-gyp; this image carries python3 but no compiler, where ubuntu-latest had both.
      - name: Install node-gyp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 make g++

      - run: pnpm install --frozen-lockfile

      - name: Generate GraphQL types
        run: pnpm gql:codegen

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm lint

      - name: Validate Prisma schema
        run: pnpm --filter @trace/server exec prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trace

      - name: ESLint
        run: pnpm lint:eslint

      - name: Format check
        run: pnpm format:check
